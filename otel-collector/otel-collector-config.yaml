# O OTel Collector é o "correio" da observabilidade: os serviços (api-node,
# depois api-go e api-rust) mandam os traces para ele, e ele repassa para onde
# precisar (aqui, só o Tempo). Isso evita que cada serviço precise saber onde
# fica o Tempo, Prometheus, etc. — eles só conhecem o Collector.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
